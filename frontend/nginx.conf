server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container. The original /api/... path is preserved
    # (no URI after the host in proxy_pass), which is what the Spring app expects.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append with $proxy_add_x_forwarded_for) so a client-supplied
        # X-Forwarded-For can't survive: the API trusts this header for the real client IP,
        # which the per-IP login rate limiter keys on. $remote_addr is the actual TCP peer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths are Angular routes, so serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted build assets; never cache the HTML shell.
    location /index.html {
        add_header Cache-Control "no-store";
    }
}
