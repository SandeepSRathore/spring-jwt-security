spring:
  application:
    name: spring-jwt-security
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

server:
  port: 8080
  error:
    include-stacktrace: never

app:
  jwt:
    # Base64-encoded HMAC key, at least 32 bytes once decoded.
    # Always override in real deployments: export JWT_SECRET=$(openssl rand -base64 48)
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtZGVwbG95aW5nLTEyMzQ1Ng==}
    issuer: http://localhost:8080
    audience: spring-jwt-security-api
    access-token-ttl: PT15M
    clock-skew: PT10S
  session:
    refresh-token-ttl: P7D
    # Hard cap for a login session, no matter how often it is refreshed.
    absolute-ttl: P30D
    max-active-per-user: 5
  login:
    max-failed-attempts: 5
    lock-duration: PT15M
    # Per client IP, sliding 60s window.
    rate-limit-per-minute: 30
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:Admin@12345}

logging:
  level:
    com.learning.jwtauth: INFO
